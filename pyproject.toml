[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt_helper"
version = "0.1.0"
description = "A LangChain Prompt Helper Module"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.1.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_helper", "prompt_helper.*"]
