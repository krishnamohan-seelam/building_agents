[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treeofthought"
version = "0.1.0"
description = "Tree of Thought Agent"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"treeofthought" = "."}
packages = ["treeofthought", "treeofthought.utils"]
